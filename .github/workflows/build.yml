      - name: Tulis app/src/main/AndroidManifest.xml
        run: |
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'GBA_FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:glEsVersion="0x00030000"
                  android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="GBA Shader Player"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode"
