      - name: Tulis app/src/main/java/id/gba/shaderplayer/Opts.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/Opts.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          /** Nama pilihan di menu. Urutan harus sama dengan logika di GameRenderer. */
          object Opts {
              val upscale = arrayOf("Tajam (anti-alias)", "Scale4x (EPX)", "Halus (bilinear)", "Piksel (nearest)")
              val light = arrayOf("Mati", "GBA LCD", "Glow hangat", "Terang (SP)")
