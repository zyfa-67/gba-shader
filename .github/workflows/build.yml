          cat > 'app/src/main/java/id/gba/shaderplayer/MainActivity.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.Color
          import android.net.Uri
          import android.opengl.GLSurfaceView
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.zip.ZipInputStream
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              companion object {
                  private const val REQ_OPEN = 1001
              }

              private lateinit var prefs: SharedPreferences
              private lateinit var glView: GLSurfaceView
              private lateinit var renderer: GameRenderer
              private lateinit var pad: GamepadView
              private lateinit var hint: TextView

              private var emu: EmuThread? = null
              private var upscaleIdx = 0
              private var lightIdx = 2
              private var touchMask = 0
              private var keyMask = 0
              private var axisMask = 0
              private var dialogs = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  prefs = getSharedPreferences("gba", MODE_PRIVATE)
                  upscaleIdx = prefs.getInt("upscale2", 0).coerceIn(0, Opts.upscale.size - 1)
                  lightIdx = prefs.getInt("light2", 2).coerceIn(0, Opts.light.size - 1)

                  renderer = GameRenderer(this) { msg -> toast(msg) }
                  renderer.upscale = upscaleIdx
                  renderer.light = lightIdx

                  glView = GLSurfaceView(this)
                  glView.setEGLContextClientVersion(3)
                  glView.setRenderer(renderer)
                  glView.renderMode = GLSurfaceView.RENDERMODE_WHEN_DIRTY

                  pad = GamepadView(this)
                  pad.onMask = { m ->
                      touchMask = m
                      pushMask()
                  }
                  pad.onMenu = { showMenu() }

                  hint = TextView(this)
                  hint.text = "Ketuk MENU lalu pilih \"Buka game…\"\n(file .gba atau .zip)"
                  hint.setTextColor(Color.WHITE)
                  hint.gravity = Gravity.CENTER
                  hint.textSize = 16f

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  root.addView(glView, FrameLayout.LayoutParams(mp, mp))
                  root.addView(hint, FrameLayout.LayoutParams(mp, mp))
                  root.addView(pad, FrameLayout.LayoutParams(mp, mp))
                  setContentView(root)
                  applyBars()

                  // Buka lagi game terakhir kalau masih bisa diakses.
                  val last = prefs.getString("lastRom", null)
                  if (last != null) startGame(Uri.parse(last))
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
                  if (dialogs == 0) emu?.paused = false
                  applyBars()
              }

              override fun onPause() {
                  emu?.paused = true
                  Native.saveSram()
                  glView.onPause()
                  super.onPause()
              }

              override fun onDestroy() {
                  stopEmu()
                  super.onDestroy()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applyBars()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) applyBars()
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  showMenu()
              }

              // Lanskap: layar penuh tanpa bar sistem. Potret: bar sistem normal.
              @Suppress("DEPRECATION")
              private fun applyBars() {
                  val landscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  if (Build.VERSION.SDK_INT >= 30) {
                      val c = window.insetsController ?: return
                      if (landscape) {
                          c.hide(WindowInsets.Type.systemBars())
                          c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      } else {
                          c.show(WindowInsets.Type.systemBars())
                      }
                  } else {
                      window.decorView.systemUiVisibility = if (landscape) {
                          View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      } else {
                          View.SYSTEM_UI_FLAG_VISIBLE
                      }
                  }
              }

              // ---------------------------------------------------------------- input fisik

              private fun pushMask() {
                  Native.setButtons(touchMask or keyMask or axisMask)
              }

              private fun keyBit(k: Int): Int = when (k) {
                  KeyEvent.KEYCODE_DPAD_UP -> GamepadView.BTN_UP
                  KeyEvent.KEYCODE_DPAD_DOWN -> GamepadView.BTN_DOWN
                  KeyEvent.KEYCODE_DPAD_LEFT -> GamepadView.BTN_LEFT
                  KeyEvent.KEYCODE_DPAD_RIGHT -> GamepadView.BTN_RIGHT
                  KeyEvent.KEYCODE_BUTTON_A, KeyEvent.KEYCODE_Z -> GamepadView.BTN_B
                  KeyEvent.KEYCODE_BUTTON_B, KeyEvent.KEYCODE_X -> GamepadView.BTN_A
                  KeyEvent.KEYCODE_BUTTON_L1, KeyEvent.KEYCODE_A -> GamepadView.BTN_L
                  KeyEvent.KEYCODE_BUTTON_R1, KeyEvent.KEYCODE_S -> GamepadView.BTN_R
                  KeyEvent.KEYCODE_BUTTON_START, KeyEvent.KEYCODE_ENTER -> GamepadView.BTN_START
                  KeyEvent.KEYCODE_BUTTON_SELECT, KeyEvent.KEYCODE_DEL, KeyEvent.KEYCODE_SHIFT_RIGHT -> GamepadView.BTN_SELECT
                  else -> -1
              }

              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  val bit = keyBit(e.keyCode)
                  if (bit >= 0) {
                      if (e.action == KeyEvent.ACTION_DOWN) {
                          keyMask = keyMask or (1 shl bit)
                      } else if (e.action == KeyEvent.ACTION_UP) {
                          keyMask = keyMask and (1 shl bit).inv()
                      }
                      pushMask()
                      return true
                  }
                  return super.dispatchKeyEvent(e)
              }

              override fun dispatchGenericMotionEvent(ev: MotionEvent): Boolean {
                  val fromStick = (ev.source and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                  if (fromStick && ev.action == MotionEvent.ACTION_MOVE) {
                      val hx = ev.getAxisValue(MotionEvent.AXIS_HAT_X)
                      val hy = ev.getAxisValue(MotionEvent.AXIS_HAT_Y)
                      val x = if (Math.abs(hx) > 0.5f) hx else ev.getAxisValue(MotionEvent.AXIS_X)
                      val y = if (Math.abs(hy) > 0.5f) hy else ev.getAxisValue(MotionEvent.AXIS_Y)
                      var m = 0
                      if (x < -0.5f) m = m or (1 shl GamepadView.BTN_LEFT)
                      if (x > 0.5f) m = m or (1 shl GamepadView.BTN_RIGHT)
                      if (y < -0.5f) m = m or (1 shl GamepadView.BTN_UP)
                      if (y > 0.5f) m = m or (1 shl GamepadView.BTN_DOWN)
                      axisMask = m
                      pushMask()
                      return true
                  }
                  return super.dispatchGenericMotionEvent(ev)
              }

              // ---------------------------------------------------------------- menu

              private fun showMenu() {
                  if (dialogs > 0) return
                  keyMask = 0
                  axisMask = 0
                  pushMask()
                  val e = emu
                  val ff = e != null && e.fastForward
                  val items = arrayOf(
                      "Buka game…",
                      "Upscale: " + Opts.upscale[upscaleIdx],
                      "Cahaya: " + Opts.light[lightIdx],
                      "Maju cepat: " + (if (ff) "Hidup" else "Mati"),
                      "Simpan state",
                      "Muat state",
                      "Reset game",
                      "Keluar"
                  )
                  dialogs++
                  emu?.paused = true
                  AlertDialog.Builder(this)
                      .setTitle("GBA Shader Player")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> openPicker()
                              1 -> choose("Upscale", Opts.upscale, upscaleIdx) { idx -> setUpscale(idx) }
                              2 -> choose("Cahaya", Opts.light, lightIdx) { idx -> setLight(idx) }
                              3 -> emu?.let { it.fastForward = !it.fastForward }
                              4 -> toast(if (Native.saveState()) "State tersimpan" else "Gagal menyimpan state")
                              5 -> toast(if (Native.loadState()) "State dimuat" else "State belum ada / gagal dimuat")
                              6 -> Native.reset()
                              7 -> finish()
                              else -> {}
                          }
                      }
                      .setOnDismissListener { closeDialog() }
                      .show()
              }

              private fun choose(title: String, names: Array<String>, cur: Int, onPick: (Int) -> Unit) {
                  dialogs++
                  emu?.paused = true
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setSingleChoiceItems(names, cur) { d, which ->
                          onPick(which)
                          d.dismiss()
                      }
                      .setOnDismissListener { closeDialog() }
                      .show()
              }

              private fun closeDialog() {
                  dialogs--
                  if (dialogs <= 0) {
                      dialogs = 0
                      emu?.paused = false
                  }
              }

              private fun setUpscale(idx: Int) {
                  upscaleIdx = idx
                  renderer.upscale = idx
                  prefs.edit().putInt("upscale2", idx).apply()
                  glView.requestRender()
              }

              private fun setLight(idx: Int) {
                  lightIdx = idx
                  renderer.light = idx
                  prefs.edit().putInt("light2", idx).apply()
                  glView.requestRender()
              }

              // ---------------------------------------------------------------- buka game

              private fun openPicker() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_OPEN)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OPEN && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (ignored: Exception) {
                      }
                      prefs.edit().putString("lastRom", uri.toString()).apply()
                      startGame(uri)
                  }
              }

              private fun startGame(uri: Uri) {
                  thread(name = "rom-loader") {
                      try {
                          val name = displayName(uri)
                          val stream = contentResolver.openInputStream(uri)
                              ?: throw RuntimeException("Tidak bisa membuka file")
                          var bytes = stream.use { it.readBytes() }
                          var romName = name
                          val isZip = bytes.size > 4 && bytes[0] == 'P'.code.toByte() && bytes[1] == 'K'.code.toByte()
                          if (isZip || name.endsWith(".zip", ignoreCase = true)) {
                              val z = unzipRom(bytes)
                                  ?: throw RuntimeException("ZIP tidak berisi file .gba/.gb/.gbc")
                              romName = z.first
                              bytes = z.second
                          }
                          val finalBytes = bytes
                          val finalName = romName
                          runOnUiThread { launchEmu(finalBytes, finalName) }
                      } catch (t: Throwable) {
                          toast("Gagal membuka game: " + (t.message ?: t.javaClass.simpleName))
                      }
                  }
              }

              private fun displayName(uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (ignored: Exception) {
                  }
                  return name ?: (uri.lastPathSegment ?: "game.gba")
              }

              private fun unzipRom(zip: ByteArray): Pair<String, ByteArray>? {
                  val z = ZipInputStream(zip.inputStream())
                  try {
                      var e = z.nextEntry
                      while (e != null) {
                          val n = e.name.lowercase()
                          if (!e.isDirectory && (n.endsWith(".gba") || n.endsWith(".gbc") || n.endsWith(".gb") || n.endsWith(".agb"))) {
                              return Pair(e.name.substringAfterLast('/'), z.readBytes())
                          }
                          e = z.nextEntry
                      }
                  } finally {
                      z.close()
                  }
                  return null
              }

              private fun launchEmu(rom: ByteArray, name: String) {
                  stopEmu()
                  hint.visibility = View.GONE
                  val t = EmuThread(this, rom, name, glView) { msg -> toast(msg) }
                  emu = t
                  t.start()
              }

              private fun stopEmu() {
                  val t = emu ?: return
                  t.quit()
                  try {
                      t.join(3000)
                  } catch (ignored: InterruptedException) {
                  }
                  emu = null
              }

              private fun toast(msg: String) {
                  runOnUiThread { Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
              }
          }
          GBA_FILE_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang SDK, NDK, CMake
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "pakai sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Unduh core mGBA (libretro, arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core_tmp
          curl -fL --retry 3 --retry-delay 5 -o core_tmp/core.zip \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          unzip -o core_tmp/core.zip -d core_tmp
          SO=$(ls core_tmp/*.so | head -n 1)
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so
          ls -l app/src/main/jniLibs/arm64-v8a
          file app/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Ringkasan error (hanya jika gagal)
        if: failure()
        run: |
          echo "=== BARIS PENTING (screenshot bagian ini) ==="
          if [ -f build.log ]; then
            grep -nE "^e: |error:|FAILURE:|What went wrong|Could not |not found|Unresolved reference" -A2 build.log | head -70 || true
          else
            echo "(build.log belum ada: gagalnya sebelum langkah Build APK)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GBAShaderPlayer-APK
          path: app/build/outputs/apk/debug/*.apk
