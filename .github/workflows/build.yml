      - name: Tulis app/src/main/assets/shaders/epx.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/epx.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Upscale 2x tepi-cerdas (Scale2x / EPX). Dipanggil 2 kali berurutan => Scale4x.
          // Piksel keluaran = piksel sumber, kecuali sudut yang jelas membentuk diagonal: diisi warna tetangga.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uTex;
          in vec2 vUV;
          out vec4 outColor;

          vec4 px(ivec2 p, ivec2 sz) {
              return texelFetch(uTex, clamp(p, ivec2(0), sz - ivec2(1)), 0);
          }

          void main() {
              ivec2 sz = textureSize(uTex, 0);
              ivec2 o = ivec2(gl_FragCoord.xy);   // koordinat piksel keluaran
              ivec2 s = o / 2;                    // piksel sumber
              ivec2 q = o - s * 2;                // sub-piksel (0/1), q.y = 0 berarti separuh atas gambar

              vec4 E = px(s, sz);
              vec4 B = px(s + ivec2(0, -1), sz);  // atas
              vec4 D = px(s + ivec2(-1, 0), sz);  // kiri
              vec4 F = px(s + ivec2(1, 0), sz);   // kanan
              vec4 H = px(s + ivec2(0, 1), sz);   // bawah

              vec4 r = E;
              if (q.y == 0) {
                  if (q.x == 0) { if (D == B && B != F && D != H) r = D; }
                  else          { if (B == F && B != D && F != H) r = F; }
              } else {
                  if (q.x == 0) { if (D == H && D != B && H != F) r = D; }
                  else          { if (H == F && D != H && B != F) r = F; }
              }
              outColor = r;
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/smooth.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/smooth.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Pass "Realistis": haluskan hasil Scale4x dengan filter bilateral (tepi dipertahankan),
          // lalu pertajam sedikit supaya tidak terlihat buram.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uTex;   // hasil EPX 4x
          uniform float uSigmaS;          // lebar spasial (dalam piksel 4x)
          uniform float uSigmaR;          // toleransi beda warna
          uniform float uSharpen;         // kekuatan unsharp mask
          in vec2 vUV;
          out vec4 outColor;

          void main() {
              ivec2 sz = textureSize(uTex, 0);
              ivec2 o = ivec2(gl_FragCoord.xy);
              vec3 c0 = texelFetch(uTex, o, 0).rgb;
              float is2 = 1.0 / (2.0 * uSigmaS * uSigmaS);
              float ir2 = 1.0 / (2.0 * uSigmaR * uSigmaR);
              vec3 sum = vec3(0.0);
              float wsum = 0.0;
              vec3 blur = vec3(0.0);
              float bsum = 0.0;
              for (int y = -4; y <= 4; y++) {
                  for (int x = -4; x <= 4; x++) {
                      vec3 c = texelFetch(uTex, clamp(o + ivec2(x, y), ivec2(0), sz - ivec2(1)), 0).rgb;
                      vec3 d = c - c0;
                      float r2 = float(x * x + y * y);
                      float w = exp(-r2 * is2 - dot(d, d) * ir2);
                      sum += c * w;
                      wsum += w;
                      float wb = exp(-r2 * is2);
                      blur += c * wb;
                      bsum += wb;
                  }
              }
              vec3 sm = sum / wsum;
              vec3 bl = blur / bsum;
              vec3 res = sm + uSharpen * (sm - bl);
              outColor = vec4(clamp(res, 0.0, 1.0), 1.0);
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/rays.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/rays.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Sinar matahari (god rays): radial blur dari posisi matahari, hanya bagian terang yang ikut menyala.
          // Dijalankan di resolusi rendah, hasilnya dibaca pass akhir.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uImg;   // gambar dasar (pakai mipmap)
          uniform vec2  uBaseSize;
          uniform vec2  uSunUV;           // posisi matahari di koordinat gambar (boleh di luar 0..1)
          uniform float uRayThr;          // ambang kecerahan yang dianggap menyala
          uniform float uRayDecay;        // peluruhan tiap langkah (0.90 - 0.98)
          uniform float uRayDensity;      // panjang sinar menuju matahari (0..1)
          in vec2 vUV;
          out vec4 outColor;

          const int N = 56;

          void main() {
              float lod0 = log2(float(textureSize(uImg, 0).x) / uBaseSize.x);
              float avg = dot(textureLod(uImg, vec2(0.5), 20.0).rgb, vec3(0.2126, 0.7152, 0.0722));
              float thr = max(uRayThr, avg + 0.10);
              vec2 delta = (uSunUV - vUV) * (uRayDensity / float(N));
              float jit = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
              vec2 p = vUV + delta * jit;
              vec3 acc = vec3(0.0);
              float w = 1.0;
              for (int i = 0; i < N; i++) {
                  p += delta;
                  vec2 inside = step(vec2(0.0), p) * step(p, vec2(1.0));
                  vec3 s = textureLod(uImg, clamp(p, 0.0, 1.0), lod0 + 0.7).rgb;
                  acc += max(s - vec3(thr), vec3(0.0)) * (w * inside.x * inside.y);
                  w *= uRayDecay;
              }
              outColor = vec4(acc * (4.0 / float(N)), 1.0);
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/final.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/final.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Pass akhir. Menggabungkan: sampling (tajam/halus), warna LCD GBA, kisi LCD, lalu gaya "shader pack":
          // cahaya matahari + relief + bayangan lembut + AO + bloom + sinar matahari + bayangan awan + tonemap.
          // Semua angka diatur dari preset "Cahaya" di GameRenderer.kt.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uImg;    // gambar dasar (mipmap aktif)
          uniform highp sampler2D uRays;   // hasil rays.frag
          uniform vec2  uBaseSize;         // ukuran asli frame (mis. 240x160)
          uniform float uSharp;            // 1 = sharp bilinear anti-alias
          uniform float uTime;             // detik, untuk animasi awan

          uniform float uColor;            // campuran koreksi warna LCD GBA (0..1)
          uniform float uGrid;             // kisi antar piksel (0..1)
          uniform float uVignette;         // gelap di tepi layar
          uniform float uBright;           // kecerahan koreksi LCD
          uniform vec3  uTint;             // nada warna akhir

          uniform vec3  uAmbient;          // cahaya langit/ambient
          uniform vec3  uSunCol;           // warna matahari
          uniform vec3  uSunDir;           // arah ke matahari (x kanan, y bawah, z ke penonton), ternormalisasi
          uniform float uRelief;           // kekuatan relief (bump dari kecerahan)
          uniform float uSpec;             // kilau
          uniform float uShadow;           // bayangan lembut
          uniform float uShadowLen;        // panjang bayangan (1 = normal)
          uniform float uAO;               // ambient occlusion
          uniform float uBloom;            // glow
          uniform float uBloomThr;         // ambang glow
          uniform float uRay;              // sinar matahari (dari area terang)
          uniform float uBeam;             // berkas cahaya matahari bergerak (volumetrik palsu)
          uniform vec2  uSunUV;            // posisi matahari di koordinat gambar
          uniform float uCloud;            // bayangan awan bergerak
          uniform float uEmissive;         // area terang menyala sendiri (malam)
          uniform float uTone;             // 1 = tonemap filmik
          uniform float uExposure;
          uniform float uSat;
          uniform float uContrast;

          in vec2 vUV;
          out vec4 outColor;

          const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);

          float luma(vec3 c) { return dot(c, LUMA); }

          vec3 fetchColor(vec2 uv, vec2 fw) {
              if (uSharp > 0.5) {
                  vec2 p = uv * uBaseSize;
                  vec2 seam = floor(p + 0.5);
                  p = seam + clamp((p - seam) / fw, -0.5, 0.5);
                  return texture(uImg, p / uBaseSize).rgb;
              }
              return texture(uImg, uv).rgb;
          }

          vec3 lcdColor(vec3 c) {
              vec3 lin = pow(c, vec3(3.2));
              vec3 m = vec3(dot(lin, vec3(0.86, 0.10, 0.04)),
                            dot(lin, vec3(0.12, 0.80, 0.08)),
                            dot(lin, vec3(0.00, 0.14, 0.86)));
              return pow(m, vec3(1.0 / 2.2));
          }

          float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

          float vnoise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                         mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
          }

          float fbm(vec2 p) {
              float a = 0.5;
              float s = 0.0;
              for (int i = 0; i < 4; i++) {
                  s += a * vnoise(p);
                  p = p * 2.03 + vec2(17.0, 9.0);
                  a *= 0.5;
              }
              return s;
          }

          vec3 filmic(vec3 x) {
              return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
          }

          void main() {
              vec2 uv = vUV;
              vec2 p = uv * uBaseSize;
              vec2 fw = max(fwidth(p), vec2(0.0001));
              vec2 px = 1.0 / uBaseSize;                                   // 1 piksel sumber dalam uv
              float lod0 = log2(float(textureSize(uImg, 0).x) / uBaseSize.x); // mip yang setara 1 piksel sumber

              vec3 c = fetchColor(uv, fw);
              float Y = luma(c);

              // 1) koreksi warna layar LCD GBA (opsional)
              vec3 base = mix(c, lcdColor(c) * uBright, uColor);
              vec3 lin = pow(base, vec3(2.2));

              // 2) rata-rata lokal (untuk AO dan bayangan)
              float Ym = luma(textureLod(uImg, uv, lod0 + 1.6).rgb);

              float ao = 1.0;
              if (uAO > 0.0) {
                  ao = 1.0 - uAO * clamp((Ym - Y) * 3.0, 0.0, 1.0);
              }

              // 3) relief: normal dari gradien kecerahan yang sudah dihaluskan, diterangi arah matahari
              float relief = 1.0;
              float spec = 0.0;
              if (uRelief > 0.0 || uSpec > 0.0) {
                  vec2 d = px * 1.4;
                  float lr = lod0 + 0.9;
                  float gx = luma(textureLod(uImg, uv + vec2(d.x, 0.0), lr).rgb) - luma(textureLod(uImg, uv - vec2(d.x, 0.0), lr).rgb);
                  float gy = luma(textureLod(uImg, uv + vec2(0.0, d.y), lr).rgb) - luma(textureLod(uImg, uv - vec2(0.0, d.y), lr).rgb);
                  vec3 n = normalize(vec3(-gx * 2.2, -gy * 2.2, 1.0));
                  float diff = dot(n, uSunDir) / uSunDir.z;
                  relief = mix(1.0, clamp(diff, 0.5, 1.5), uRelief);
                  vec3 h = normalize(uSunDir + vec3(0.0, 0.0, 1.0));
                  spec = pow(max(dot(n, h), 0.0), 40.0) * uSpec;
              }

              // 4) bayangan lembut: ada yang sangat gelap (outline/tinggi) di arah matahari => kita terlindung
              float shade = 1.0;
              if (uShadow > 0.0) {
                  vec2 ld = normalize(uSunDir.xy) * px * uShadowLen * 0.75;
                  float jit = hash(gl_FragCoord.xy);
                  float sh = 0.0;
                  for (int i = 0; i < 12; i++) {
                      float fi = float(i) + jit + 1.0;
                      float ys = luma(textureLod(uImg, uv + ld * fi, lod0 + 0.5).rgb);
                      sh = max(sh, smoothstep(0.16, 0.42, Ym - ys) * (1.0 - fi / 13.5));
                  }
                  shade = 1.0 - uShadow * sh;
              }

              // 5) bayangan awan
              float cloud = 0.0;
              if (uCloud > 0.0) {
                  vec2 cp = vec2(uv.x * (uBaseSize.x / uBaseSize.y), uv.y) * 1.4 + vec2(uTime * 0.015, uTime * 0.007);
                  cloud = smoothstep(0.38, 0.66, fbm(cp)) * uCloud;
              }

              // 6) gabungkan cahaya
              vec3 sun = uSunCol * shade * (1.0 - 0.8 * cloud);
              vec3 lit = lin * (uAmbient + sun) * relief * ao;
              lit += uSunCol * spec * shade;
              if (uEmissive > 0.0) {
                  float avgY = luma(textureLod(uImg, vec2(0.5), 20.0).rgb);
                  lit += lin * uEmissive * smoothstep(avgY + 0.06, avgY + 0.22, Y);
              }

              // 7) bloom dari mipmap (beberapa tingkat blur); ambang lunak menyesuaikan rata-rata kecerahan layar
              if (uBloom > 0.0) {
                  float avg = luma(textureLod(uImg, vec2(0.5), 20.0).rgb);
                  float thr = max(uBloomThr, avg + 0.10);
                  vec3 b = vec3(0.0);
                  float wsum = 0.0;
                  for (int i = 0; i < 6; i++) {
                      float l = lod0 + 0.5 + float(i) * 0.85;
                      vec3 s = textureLod(uImg, uv, l).rgb;
                      float k = smoothstep(thr - 0.12, thr + 0.12, luma(s));
                      float w = 1.0 + float(i) * 0.35;
                      b += s * k * w;
                      wsum += w;
                  }
                  lit += pow(b / wsum, vec3(2.2)) * uBloom * 3.0;
              }

              // 8) sinar matahari: dari area terang (rays.frag) + berkas bergerak
              if (uRay > 0.0) {
                  vec3 r = texture(uRays, uv).rgb;
                  lit += pow(r, vec3(2.2)) * uSunCol * uRay * 3.0 * (1.0 - 0.6 * cloud);
              }
              if (uBeam > 0.0) {
                  vec2 dv = (uv - uSunUV) * vec2(uBaseSize.x / uBaseSize.y, 1.0);
                  float dist = length(dv);
                  float ang = atan(dv.y, dv.x);
                  float n1 = vnoise(vec2(ang * 6.0, uTime * 0.05));
                  float n2 = vnoise(vec2(ang * 15.0 + 3.0, uTime * 0.08 + 7.0));
                  float shafts = smoothstep(0.38, 0.80, n1 * 0.65 + n2 * 0.35);
                  float beam = shafts * exp(-dist * 0.75) * (1.0 - 0.7 * cloud);
                  lit += (lin * 1.1 + vec3(0.06)) * uSunCol * beam * uBeam;
              }

              // 9) tonemap + grading
              lit *= uExposure;
              if (uTone > 0.5) lit = filmic(lit);
              vec3 col = pow(clamp(lit, 0.0, 1.0), vec3(1.0 / 2.2));
              float lc = luma(col);
              col = mix(vec3(lc), col, uSat);
              col = (col - 0.5) * uContrast + 0.5;

              // 10) kisi LCD dan vignette
              vec2 f = fract(p);
              vec2 g = smoothstep(vec2(0.0), vec2(0.20), f) * (1.0 - smoothstep(vec2(0.80), vec2(1.0), f));
              col *= mix(1.0, g.x * g.y, uGrid);
              vec2 q = uv - 0.5;
              col *= 1.0 - uVignette * dot(q, q) * 1.8;
              col *= uTint;

              // dithering halus supaya gradasi tidak berpita
              col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
              outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/java/id/gba/shaderplayer/Native.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/Native.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import java.nio.ByteBuffer

          /** Jembatan ke native-lib.cpp (frontend libretro). Semua fungsi aman dipanggil dari thread mana pun. */
          object Native {
              init {
                  System.loadLibrary("gbanative")
              }

              /** Mengembalikan null kalau sukses, atau pesan error. */
              external fun loadCore(corePath: String, systemDir: String, saveDir: String): String?
              external fun loadGame(rom: ByteArray, romName: String): String?
              external fun runFrame()
              external fun reset()

              /** Salin frame terbaru (RGBA) ke buffer. Hasil: (lebar shl 16) or tinggi, atau 0 kalau tidak ada frame baru. */
              external fun getFrame(dst: ByteBuffer): Int

              /** Ambil audio stereo 48 kHz. Hasil: jumlah short yang terisi. */
              external fun drainAudio(dst: ShortArray): Int

              /** [fps, sampleRateCore, lebarDasar, tinggiDasar] */
              external fun avInfo(): DoubleArray
              external fun setButtons(mask: Int)
              external fun saveSram()
              external fun saveState(): Boolean
              external fun loadState(): Boolean
              external fun unload()
          }
          GBA_FILE_EOF

