              val upscale = arrayOf(
                  "Realistis (HD halus)",
                  "Tajam (anti-alias)",
                  "Scale4x (EPX)",
                  "Halus (bilinear)",
                  "Piksel (nearest)"
              )
              val light = arrayOf(
                  "Mati",
                  "GBA LCD",
                  "Shader Siang",
