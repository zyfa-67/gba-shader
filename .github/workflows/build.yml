          #version 300 es
          // Cadangan: tampilkan tekstur apa adanya (dipakai kalau final.frag gagal dikompilasi).
          precision mediump float;
          uniform highp sampler2D uSrc;
          in vec2 vUV;
          out vec4 outColor;
