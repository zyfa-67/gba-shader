name: Build APK (satu file)

# CARA PAKAI
# 1. Di repo GitHub kamu: Add file > Create new file, beri nama  .github/workflows/build.yml
#    (kalau file itu sudah ada: buka, ketuk ikon pensil, pilih semua isinya, lalu tempel file ini)
# 2. Tempel SELURUH isi file ini, lalu Commit changes.
# 3. Buka tab Actions, tunggu build selesai, unduh APK di bagian Artifacts.
#
# File ini membuat seluruh project Android di dalam server GitHub (tidak perlu upload folder),
# mengunduh core mGBA, lalu membuild APK. Isi tiap file project ada di langkah "Tulis ..." di bawah
# dan bisa diedit langsung di sini (mis. shader di langkah "Tulis app/src/main/assets/shaders/final.frag").

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis settings.gradle.kts
        run: |
          mkdir -p '.'
          cat > 'settings.gradle.kts' <<'GBA_FILE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GBAShaderPlayer"
          include(":app")
          GBA_FILE_EOF

      - name: Tulis build.gradle.kts
        run: |
          mkdir -p '.'
          cat > 'build.gradle.kts' <<'GBA_FILE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          GBA_FILE_EOF

      - name: Tulis gradle.properties
        run: |
          mkdir -p '.'
          cat > 'gradle.properties' <<'GBA_FILE_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          GBA_FILE_EOF

      - name: Tulis app/build.gradle.kts
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'GBA_FILE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "id.gba.shaderplayer"
              compileSdk = 34
              ndkVersion = "26.1.10909125"

              defaultConfig {
                  applicationId = "id.gba.shaderplayer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
              }

              // Kunci debug tetap (ikut di repo) supaya versi baru bisa menimpa versi lama tanpa uninstall.
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              // Core mGBA (.so) di-dlopen dari folder native app, jadi harus diekstrak saat install.
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GBA_FILE_EOF

