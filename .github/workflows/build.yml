      - name: Tulis app/src/main/cpp/CMakeLists.txt
        run: |
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/CMakeLists.txt' <<'GBA_FILE_EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(gbanative LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          add_library(gbanative SHARED native-lib.cpp)

          find_library(log-lib log)
          target_link_libraries(gbanative ${log-lib} dl)
          GBA_FILE_EOF

      - name: Tulis app/src/main/cpp/native-lib.cpp
        run: |
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/native-lib.cpp' <<'GBA_FILE_EOF'
          // Frontend libretro minimal untuk GBA (core mGBA), dipanggil dari Kotlin lewat JNI.
          // Tugasnya: dlopen core, jalankan frame, konversi video ke RGBA, resample audio ke 48 kHz,
          // terima input tombol, simpan/muat SRAM dan save state.

          #include <jni.h>
          #include <android/log.h>
          #include <dlfcn.h>

          #include <algorithm>
          #include <atomic>
          #include <cstdarg>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <map>
          #include <mutex>
          #include <string>
          #include <vector>

          #define TAG "GBAShader"
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          // ===================== Subset libretro.h =====================
          #define RETRO_DEVICE_JOYPAD 1
          #define RETRO_MEMORY_SAVE_RAM 0

          #define ENV_GET_CAN_DUPE 3
          #define ENV_SET_MESSAGE 6
          #define ENV_SET_PERFORMANCE_LEVEL 8
          #define ENV_GET_SYSTEM_DIRECTORY 9
          #define ENV_SET_PIXEL_FORMAT 10
          #define ENV_SET_INPUT_DESCRIPTORS 11
          #define ENV_GET_VARIABLE 15
          #define ENV_SET_VARIABLES 16
          #define ENV_GET_VARIABLE_UPDATE 17
          #define ENV_SET_SUPPORT_NO_GAME 18
          #define ENV_GET_LOG_INTERFACE 27
          #define ENV_GET_SAVE_DIRECTORY 31
          #define ENV_SET_SYSTEM_AV_INFO 32
          #define ENV_SET_CONTROLLER_INFO 35
          #define ENV_SET_GEOMETRY 37
          #define ENV_SET_SERIALIZATION_QUIRKS 44

          struct retro_game_geometry {
              unsigned base_width;
              unsigned base_height;
              unsigned max_width;
              unsigned max_height;
              float aspect_ratio;
          };
          struct retro_system_timing {
              double fps;
              double sample_rate;
          };
          struct retro_system_av_info {
              retro_game_geometry geometry;
              retro_system_timing timing;
          };
          struct retro_system_info {
              const char* library_name;
              const char* library_version;
              const char* valid_extensions;
              bool need_fullpath;
              bool block_extract;
          };
          struct retro_game_info {
              const char* path;
              const void* data;
              size_t size;
              const char* meta;
          };
          struct retro_variable {
              const char* key;
              const char* value;
          };
          struct retro_log_callback {
              void (*log)(int level, const char* fmt, ...);
          };

          typedef bool (*retro_environment_t)(unsigned cmd, void* data);
          typedef void (*retro_video_refresh_t)(const void* data, unsigned width, unsigned height, size_t pitch);
          typedef void (*retro_audio_sample_t)(int16_t left, int16_t right);
          typedef size_t (*retro_audio_sample_batch_t)(const int16_t* data, size_t frames);
          typedef void (*retro_input_poll_t)(void);
          typedef int16_t (*retro_input_state_t)(unsigned port, unsigned device, unsigned index, unsigned id);

          // ===================== Fungsi dari core =====================
          static void* g_lib = nullptr;

          static void (*fn_set_environment)(retro_environment_t) = nullptr;
          static void (*fn_set_video_refresh)(retro_video_refresh_t) = nullptr;
          static void (*fn_set_audio_sample)(retro_audio_sample_t) = nullptr;
          static void (*fn_set_audio_sample_batch)(retro_audio_sample_batch_t) = nullptr;
          static void (*fn_set_input_poll)(retro_input_poll_t) = nullptr;
          static void (*fn_set_input_state)(retro_input_state_t) = nullptr;
          static void (*fn_init)(void) = nullptr;
          static void (*fn_deinit)(void) = nullptr;
          static void (*fn_get_system_info)(retro_system_info*) = nullptr;
          static void (*fn_get_av_info)(retro_system_av_info*) = nullptr;
          static void (*fn_reset)(void) = nullptr;
          static void (*fn_run)(void) = nullptr;
          static size_t (*fn_serialize_size)(void) = nullptr;
          static bool (*fn_serialize)(void*, size_t) = nullptr;
          static bool (*fn_unserialize)(const void*, size_t) = nullptr;
          static bool (*fn_load_game)(const retro_game_info*) = nullptr;
          static void (*fn_unload_game)(void) = nullptr;
          static void* (*fn_get_memory_data)(unsigned) = nullptr;
          static size_t (*fn_get_memory_size)(unsigned) = nullptr;

          #define BIND(var, sym)                                                        \
              do {                                                                      \
                  var = reinterpret_cast<decltype(var)>(dlsym(g_lib, sym));             \
                  if (!var && !missing) missing = sym;                                  \
              } while (0)

          // ===================== State global =====================
          static std::mutex g_core_mtx;   // semua panggilan ke core diserialkan
          static std::mutex g_frame_mtx;
          static std::mutex g_audio_mtx;

          static bool g_loaded = false;
          static std::string g_system_dir, g_save_dir, g_sram_path, g_state_path, g_rom_name, g_rom_tmp;
          static std::map<std::string, std::string> g_vars;
          static unsigned g_pixfmt = 0;  // 0 = 0RGB1555 (default libretro), 1 = XRGB8888, 2 = RGB565

          static std::vector<uint32_t> g_frame;  // RGBA (byte R,G,B,A)
          static int g_fw = 0, g_fh = 0;
          static bool g_dirty = false;

          static const double OUT_RATE = 48000.0;
          static std::vector<int16_t> g_audio;   // stereo 48 kHz, interleaved
          static double g_ratio = 32768.0 / OUT_RATE;
          static double g_pos = 0.0;
          static int16_t g_prev_l = 0, g_prev_r = 0;

          static std::atomic<int> g_buttons{0};
          static std::vector<uint8_t> g_rom;
          static std::vector<uint8_t> g_last_sram;
          static double g_fps = 59.7275, g_in_rate = 32768.0;
          static int g_base_w = 240, g_base_h = 160;

          // ===================== Callback untuk core =====================
          static void log_cb(int level, const char* fmt, ...) {
              va_list ap;
              va_start(ap, fmt);
              __android_log_vprint(level >= 3 ? ANDROID_LOG_ERROR : ANDROID_LOG_DEBUG, "core", fmt, ap);
              va_end(ap);
          }

          static void apply_av(const retro_system_av_info& av) {
              std::lock_guard<std::mutex> lk(g_audio_mtx);
              if (av.timing.fps > 1.0) g_fps = av.timing.fps;
              if (av.timing.sample_rate > 1.0) g_in_rate = av.timing.sample_rate;
              g_ratio = g_in_rate / OUT_RATE;
              g_base_w = static_cast<int>(av.geometry.base_width);
              g_base_h = static_cast<int>(av.geometry.base_height);
          }

          static bool env_cb(unsigned cmd, void* data) {
              switch (cmd) {
                  case ENV_GET_CAN_DUPE:
                      *static_cast<bool*>(data) = true;
                      return true;
                  case ENV_SET_PIXEL_FORMAT: {
                      const unsigned f = *static_cast<const unsigned*>(data);
                      if (f > 2) return false;
                      g_pixfmt = f;
                      return true;
                  }
                  case ENV_GET_SYSTEM_DIRECTORY:
                      *static_cast<const char**>(data) = g_system_dir.c_str();
                      return true;
                  case ENV_GET_SAVE_DIRECTORY:
                      *static_cast<const char**>(data) = g_save_dir.c_str();
                      return true;
                  case ENV_GET_LOG_INTERFACE:
                      static_cast<retro_log_callback*>(data)->log = log_cb;
                      return true;
                  case ENV_SET_VARIABLES: {
                      // Format tiap entri: "Judul; nilai_default|nilai_lain|..."
                      const retro_variable* v = static_cast<const retro_variable*>(data);
                      for (; v && v->key; ++v) {
                          const std::string val = v->value ? v->value : "";
                          const size_t semi = val.find("; ");
                          if (semi == std::string::npos) continue;
                          const std::string opts = val.substr(semi + 2);
                          const size_t bar = opts.find('|');
                          g_vars[v->key] = opts.substr(0, bar);
                      }
                      return true;
                  }
                  case ENV_GET_VARIABLE: {
                      retro_variable* v = static_cast<retro_variable*>(data);
                      if (!v || !v->key) return false;
                      const auto it = g_vars.find(v->key);
                      if (it == g_vars.end()) return false;
                      v->value = it->second.c_str();
                      return true;
                  }
                  case ENV_GET_VARIABLE_UPDATE:
                      *static_cast<bool*>(data) = false;
                      return true;
                  case ENV_SET_SYSTEM_AV_INFO:
                      apply_av(*static_cast<const retro_system_av_info*>(data));
                      return true;
                  case ENV_SET_GEOMETRY:
                  case ENV_SET_INPUT_DESCRIPTORS:
                  case ENV_SET_CONTROLLER_INFO:
                  case ENV_SET_SERIALIZATION_QUIRKS:
                  case ENV_SET_PERFORMANCE_LEVEL:
                  case ENV_SET_SUPPORT_NO_GAME:
                  case ENV_SET_MESSAGE:
                      return true;
                  default:
                      return false;  // hw render, sensor, rumble, dll: tidak didukung
              }
          }

          static inline uint32_t expand5(uint32_t v) { return (v << 3) | (v >> 2); }

          static void video_cb(const void* data, unsigned w, unsigned h, size_t pitch) {
              if (!data || w == 0 || h == 0 || w > 1024 || h > 1024) return;  // data null = frame sama
              std::lock_guard<std::mutex> lk(g_frame_mtx);
              if (g_frame.size() < static_cast<size_t>(w) * h) g_frame.resize(static_cast<size_t>(w) * h);
              const uint8_t* src = static_cast<const uint8_t*>(data);
              for (unsigned y = 0; y < h; ++y) {
                  const uint8_t* row = src + static_cast<size_t>(y) * pitch;
                  uint32_t* dst = &g_frame[static_cast<size_t>(y) * w];
                  if (g_pixfmt == 1) {  // XRGB8888
                      const uint32_t* s = reinterpret_cast<const uint32_t*>(row);
                      for (unsigned x = 0; x < w; ++x) {
                          const uint32_t p = s[x];
                          dst[x] = 0xFF000000u | ((p & 0xFFu) << 16) | (p & 0xFF00u) | ((p >> 16) & 0xFFu);
                      }
                  } else if (g_pixfmt == 2) {  // RGB565
                      const uint16_t* s = reinterpret_cast<const uint16_t*>(row);
                      for (unsigned x = 0; x < w; ++x) {
                          const uint32_t p = s[x];
                          const uint32_t r = expand5((p >> 11) & 31u);
                          const uint32_t g = (((p >> 5) & 63u) << 2) | (((p >> 5) & 63u) >> 4);
                          const uint32_t b = expand5(p & 31u);
                          dst[x] = 0xFF000000u | (b << 16) | (g << 8) | r;
                      }
                  } else {  // 0RGB1555
                      const uint16_t* s = reinterpret_cast<const uint16_t*>(row);
                      for (unsigned x = 0; x < w; ++x) {
                          const uint32_t p = s[x];
                          const uint32_t r = expand5((p >> 10) & 31u);
                          const uint32_t g = expand5((p >> 5) & 31u);
                          const uint32_t b = expand5(p & 31u);
                          dst[x] = 0xFF000000u | (b << 16) | (g << 8) | r;
                      }
                  }
              }
              g_fw = static_cast<int>(w);
              g_fh = static_cast<int>(h);
              g_dirty = true;
          }

          // Resample linear dari sample rate core (mGBA: 32768 Hz) ke 48 kHz.
          static void push_audio(const int16_t* d, size_t frames) {
              std::lock_guard<std::mutex> lk(g_audio_mtx);
              if (g_audio.size() > 96000) g_audio.clear();  // konsumer macet: buang saja
              for (size_t i = 0; i < frames; ++i) {
                  const int16_t cl = d[2 * i];
                  const int16_t cr = d[2 * i + 1];
                  while (g_pos < 1.0) {
                      const float t = static_cast<float>(g_pos);
                      g_audio.push_back(static_cast<int16_t>(g_prev_l + (cl - g_prev_l) * t));
                      g_audio.push_back(static_cast<int16_t>(g_prev_r + (cr - g_prev_r) * t));
                      g_pos += g_ratio;
                  }
                  g_pos -= 1.0;
                  g_prev_l = cl;
                  g_prev_r = cr;
              }
          }

          static size_t audio_batch_cb(const int16_t* d, size_t frames) {
              push_audio(d, frames);
              return frames;
          }

          static void audio_sample_cb(int16_t l, int16_t r) {
              const int16_t b[2] = {l, r};
              push_audio(b, 1);
          }

          static void input_poll_cb(void) {}

          static int16_t input_state_cb(unsigned port, unsigned device, unsigned index, unsigned id) {
              if (port != 0 || device != RETRO_DEVICE_JOYPAD || index != 0 || id > 15) return 0;
              return static_cast<int16_t>((g_buttons.load() >> id) & 1);
          }

          // ===================== Util =====================
          static std::string jstr(JNIEnv* env, jstring s) {
              if (!s) return "";
              const char* c = env->GetStringUTFChars(s, nullptr);
              std::string r = c ? c : "";
              if (c) env->ReleaseStringUTFChars(s, c);
              return r;
          }

          static void load_sram_locked() {
              void* ptr = fn_get_memory_data(RETRO_MEMORY_SAVE_RAM);
              const size_t sz = fn_get_memory_size(RETRO_MEMORY_SAVE_RAM);
              if (!ptr || sz == 0) {
                  g_last_sram.clear();
                  return;
              }
              FILE* f = fopen(g_sram_path.c_str(), "rb");
              if (f) {
                  std::vector<uint8_t> buf(sz);
                  const size_t r = fread(buf.data(), 1, sz, f);
                  fclose(f);
                  if (r > 0) memcpy(ptr, buf.data(), r);
              }
              g_last_sram.assign(static_cast<uint8_t*>(ptr), static_cast<uint8_t*>(ptr) + sz);
          }

          static void save_sram_locked() {
              if (!g_lib || !g_loaded) return;
              void* ptr = fn_get_memory_data(RETRO_MEMORY_SAVE_RAM);
              const size_t sz = fn_get_memory_size(RETRO_MEMORY_SAVE_RAM);
              if (!ptr || sz == 0) return;
              if (g_last_sram.size() == sz && memcmp(g_last_sram.data(), ptr, sz) == 0) return;  // tidak berubah
              FILE* f = fopen(g_sram_path.c_str(), "wb");
              if (!f) {
                  LOGE("Gagal menulis SRAM: %s", g_sram_path.c_str());
                  return;
              }
              fwrite(ptr, 1, sz, f);
              fclose(f);
              g_last_sram.assign(static_cast<uint8_t*>(ptr), static_cast<uint8_t*>(ptr) + sz);
          }

          static void unload_locked() {
              if (!g_lib) return;
              if (g_loaded) {
                  save_sram_locked();
                  fn_unload_game();
                  g_loaded = false;
              }
              if (fn_deinit) fn_deinit();
              dlclose(g_lib);
              g_lib = nullptr;
          }

          // ===================== JNI =====================
          extern "C" {

          JNIEXPORT jstring JNICALL Java_id_gba_shaderplayer_Native_loadCore(
                  JNIEnv* env, jobject, jstring jcore, jstring jsys, jstring jsave) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              unload_locked();
              const std::string core = jstr(env, jcore);
              g_system_dir = jstr(env, jsys);
              g_save_dir = jstr(env, jsave);

              g_lib = dlopen(core.c_str(), RTLD_NOW | RTLD_LOCAL);
              if (!g_lib) {
                  const char* e = dlerror();
                  const std::string msg = std::string("Gagal memuat core mGBA: ") + (e ? e : "?");
                  LOGE("%s", msg.c_str());
                  return env->NewStringUTF(msg.c_str());
              }

              const char* missing = nullptr;
              BIND(fn_set_environment, "retro_set_environment");
              BIND(fn_set_video_refresh, "retro_set_video_refresh");
              BIND(fn_set_audio_sample, "retro_set_audio_sample");
              BIND(fn_set_audio_sample_batch, "retro_set_audio_sample_batch");
              BIND(fn_set_input_poll, "retro_set_input_poll");
              BIND(fn_set_input_state, "retro_set_input_state");
              BIND(fn_init, "retro_init");
              BIND(fn_deinit, "retro_deinit");
              BIND(fn_get_system_info, "retro_get_system_info");
              BIND(fn_get_av_info, "retro_get_system_av_info");
              BIND(fn_reset, "retro_reset");
              BIND(fn_run, "retro_run");
              BIND(fn_serialize_size, "retro_serialize_size");
              BIND(fn_serialize, "retro_serialize");
              BIND(fn_unserialize, "retro_unserialize");
              BIND(fn_load_game, "retro_load_game");
              BIND(fn_unload_game, "retro_unload_game");
              BIND(fn_get_memory_data, "retro_get_memory_data");
              BIND(fn_get_memory_size, "retro_get_memory_size");
              if (missing) {
                  const std::string msg = std::string("Core tidak lengkap, simbol hilang: ") + missing;
                  dlclose(g_lib);
                  g_lib = nullptr;
                  fn_deinit = nullptr;
                  return env->NewStringUTF(msg.c_str());
              }

              g_vars.clear();
              g_pixfmt = 0;
              g_loaded = false;
              {
                  std::lock_guard<std::mutex> a(g_audio_mtx);
                  g_audio.clear();
              }
              fn_set_environment(env_cb);
              fn_init();
              fn_set_video_refresh(video_cb);
              fn_set_audio_sample(audio_sample_cb);
              fn_set_audio_sample_batch(audio_batch_cb);
              fn_set_input_poll(input_poll_cb);
              fn_set_input_state(input_state_cb);
              return nullptr;
          }

          JNIEXPORT jstring JNICALL Java_id_gba_shaderplayer_Native_loadGame(
                  JNIEnv* env, jobject, jbyteArray rom, jstring jname) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              if (!g_lib) return env->NewStringUTF("Core belum dimuat");

              g_rom_name = jstr(env, jname);
              const jsize n = env->GetArrayLength(rom);
              g_rom.assign(static_cast<size_t>(n), 0);
              env->GetByteArrayRegion(rom, 0, n, reinterpret_cast<jbyte*>(g_rom.data()));

              std::string base = g_rom_name;
              std::string ext;
              const size_t dot = base.rfind('.');
              if (dot != std::string::npos) {
                  ext = base.substr(dot);
                  base = base.substr(0, dot);
              }
              for (char& ch : base) {
                  if (ch == '/' || ch == '\\') ch = '_';
              }
              if (base.empty()) base = "game";
              g_sram_path = g_save_dir + "/" + base + ".srm";
              g_state_path = g_save_dir + "/" + base + ".state";

              retro_system_info si;
              memset(&si, 0, sizeof(si));
              fn_get_system_info(&si);

              retro_game_info gi;
              memset(&gi, 0, sizeof(gi));
              if (si.need_fullpath) {
                  g_rom_tmp = g_save_dir + "/_rom_tmp" + ext;
                  FILE* f = fopen(g_rom_tmp.c_str(), "wb");
                  if (!f) return env->NewStringUTF("Tidak bisa menulis ROM sementara");
                  fwrite(g_rom.data(), 1, g_rom.size(), f);
                  fclose(f);
                  gi.path = g_rom_tmp.c_str();
              } else {
                  gi.path = g_rom_name.c_str();
                  gi.data = g_rom.data();
                  gi.size = g_rom.size();
              }

              if (!fn_load_game(&gi)) return env->NewStringUTF("Core menolak ROM ini (retro_load_game gagal)");
              g_loaded = true;

              retro_system_av_info av;
              memset(&av, 0, sizeof(av));
              fn_get_av_info(&av);
              apply_av(av);
              {
                  std::lock_guard<std::mutex> a(g_audio_mtx);
                  g_audio.clear();
                  g_pos = 0.0;
                  g_prev_l = 0;
                  g_prev_r = 0;
              }
              load_sram_locked();
              return nullptr;
          }

          JNIEXPORT void JNICALL Java_id_gba_shaderplayer_Native_runFrame(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              if (g_lib && g_loaded) fn_run();
          }

          JNIEXPORT void JNICALL Java_id_gba_shaderplayer_Native_reset(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              if (g_lib && g_loaded) fn_reset();
          }

          // Mengembalikan (lebar << 16) | tinggi kalau ada frame baru, selain itu 0.
          JNIEXPORT jint JNICALL Java_id_gba_shaderplayer_Native_getFrame(JNIEnv* env, jobject, jobject buf) {
              std::lock_guard<std::mutex> lk(g_frame_mtx);
              if (!g_dirty || g_fw <= 0 || g_fh <= 0) return 0;
              void* dst = env->GetDirectBufferAddress(buf);
              const jlong cap = env->GetDirectBufferCapacity(buf);
              const size_t need = static_cast<size_t>(g_fw) * static_cast<size_t>(g_fh) * 4;
              if (!dst || cap < static_cast<jlong>(need)) return 0;
              memcpy(dst, g_frame.data(), need);
              g_dirty = false;
              return (g_fw << 16) | g_fh;
          }

          // Mengisi array dengan sample stereo 48 kHz (interleaved). Mengembalikan jumlah short.
          JNIEXPORT jint JNICALL Java_id_gba_shaderplayer_Native_drainAudio(JNIEnv* env, jobject, jshortArray arr) {
              std::lock_guard<std::mutex> lk(g_audio_mtx);
              const jsize cap = env->GetArrayLength(arr);
              jsize n = static_cast<jsize>(std::min<size_t>(g_audio.size(), static_cast<size_t>(cap)));
              n &= ~1;  // jaga pasangan kiri/kanan
              if (n <= 0) return 0;
              env->SetShortArrayRegion(arr, 0, n, g_audio.data());
              g_audio.erase(g_audio.begin(), g_audio.begin() + n);
              return n;
          }

          // [fps, sampleRateCore, lebarDasar, tinggiDasar]
          JNIEXPORT jdoubleArray JNICALL Java_id_gba_shaderplayer_Native_avInfo(JNIEnv* env, jobject) {
              jdoubleArray arr = env->NewDoubleArray(4);
              const jdouble v[4] = {g_fps, g_in_rate, static_cast<double>(g_base_w), static_cast<double>(g_base_h)};
              env->SetDoubleArrayRegion(arr, 0, 4, v);
              return arr;
          }

          JNIEXPORT void JNICALL Java_id_gba_shaderplayer_Native_setButtons(JNIEnv*, jobject, jint mask) {
              g_buttons.store(mask);
          }

          JNIEXPORT void JNICALL Java_id_gba_shaderplayer_Native_saveSram(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              save_sram_locked();
          }

          JNIEXPORT jboolean JNICALL Java_id_gba_shaderplayer_Native_saveState(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              if (!g_lib || !g_loaded) return JNI_FALSE;
              const size_t sz = fn_serialize_size();
              if (sz == 0) return JNI_FALSE;
              std::vector<uint8_t> buf(sz);
              if (!fn_serialize(buf.data(), sz)) return JNI_FALSE;
              FILE* f = fopen(g_state_path.c_str(), "wb");
              if (!f) return JNI_FALSE;
              const size_t w = fwrite(buf.data(), 1, sz, f);
              fclose(f);
              return w == sz ? JNI_TRUE : JNI_FALSE;
          }

          JNIEXPORT jboolean JNICALL Java_id_gba_shaderplayer_Native_loadState(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              if (!g_lib || !g_loaded) return JNI_FALSE;
              FILE* f = fopen(g_state_path.c_str(), "rb");
              if (!f) return JNI_FALSE;
              fseek(f, 0, SEEK_END);
              const long len = ftell(f);
              fseek(f, 0, SEEK_SET);
              if (len <= 0) {
                  fclose(f);
                  return JNI_FALSE;
              }
              std::vector<uint8_t> buf(static_cast<size_t>(len));
              const size_t r = fread(buf.data(), 1, buf.size(), f);
              fclose(f);
              if (r != buf.size()) return JNI_FALSE;
              return fn_unserialize(buf.data(), buf.size()) ? JNI_TRUE : JNI_FALSE;
          }

          JNIEXPORT void JNICALL Java_id_gba_shaderplayer_Native_unload(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> lk(g_core_mtx);
              unload_locked();
          }

          }  // extern "C"
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/vertex.vert
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/vertex.vert' <<'GBA_FILE_EOF'
          #version 300 es
          // Segitiga layar penuh tanpa buffer: 3 titik dibentuk dari gl_VertexID.
          uniform float uFlip;   // 0 = urutan baris sama dengan gambar (pass ke FBO), 1 = dibalik (pass ke layar)
          out vec2 vUV;
          void main() {
              vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
              vUV = vec2(p.x, mix(p.y, 1.0 - p.y, uFlip));
              gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/plain.frag
        run: |
