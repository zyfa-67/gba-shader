      - name: Tulis app/src/main/java/id/gba/shaderplayer/GameRenderer.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/GameRenderer.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import android.content.Context
          import android.opengl.GLES30
          import android.opengl.GLSurfaceView
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10

          /**
           * Renderer OpenGL ES 3.0.
           * Alur: frame core -> (opsional) Scale4x/EPX 2 pass -> pass akhir (warna LCD, kisi, glow, vignette) -> layar.
           * Semua shader ada di assets/shaders/ dan bisa diedit. Kalau shader gagal kompilasi, muncul toast berisi
           * log error dan aplikasi memakai tampilan cadangan (bukan layar hitam).
           */
          class GameRenderer(
              private val ctx: Context,
              private val onError: (String) -> Unit
          ) : GLSurfaceView.Renderer {

              /** Indeks Opts.upscale: 0 tajam, 1 Scale4x, 2 bilinear, 3 nearest. */
              @Volatile var upscale = 0

              /** Indeks Opts.light -> baris di presets. */
              @Volatile var light = 1

              private class Light(
                  val color: Float, val grid: Float, val glow: Float, val vig: Float,
                  val bright: Float, val tr: Float, val tg: Float, val tb: Float
              )

              // color, grid, glow, vignette, kecerahan, tint R, G, B
              private val presets = arrayOf(
                  Light(0f, 0f, 0f, 0f, 1f, 1f, 1f, 1f),                       // Mati
                  Light(1f, 0.55f, 0.15f, 0.10f, 1.25f, 1f, 1f, 1f),           // GBA LCD
                  Light(0.6f, 0.15f, 0.9f, 0.30f, 1.05f, 1.04f, 1f, 0.92f),    // Glow hangat
                  Light(0.5f, 0f, 0.25f, 0f, 1.15f, 1f, 1f, 1f)                // Terang (SP)
              )

              private val frameBuf: ByteBuffer =
                  ByteBuffer.allocateDirect(512 * 512 * 4).order(ByteOrder.nativeOrder())

              private var surfW = 1
              private var surfH = 1
              private var srcW = 0
              private var srcH = 0
              private var hasFrame = false
              private var fboOk = true

              private var texSrc = 0
              private val texUp = IntArray(2)
              private val fbo = IntArray(2)

              private var progPlain = 0
              private var progEpx = 0
              private var progFinal = 0

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  srcW = 0
                  srcH = 0
                  hasFrame = false
                  fboOk = true
                  texSrc = 0
                  texUp[0] = 0
                  texUp[1] = 0
                  fbo[0] = 0
                  fbo[1] = 0

                  val vao = IntArray(1)
                  GLES30.glGenVertexArrays(1, vao, 0)
                  GLES30.glBindVertexArray(vao[0])

                  progPlain = buildProgram("plain.frag")
                  progEpx = buildProgram("epx.frag")
                  progFinal = buildProgram("final.frag")
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  surfW = width
                  surfH = height
              }

              override fun onDrawFrame(gl: GL10?) {
                  val packed = Native.getFrame(frameBuf)
                  if (packed != 0) {
                      val w = packed ushr 16
                      val h = packed and 0xFFFF
                      ensureTextures(w, h)
                      frameBuf.position(0)
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, texSrc)
                      GLES30.glTexSubImage2D(
                          GLES30.GL_TEXTURE_2D, 0, 0, 0, w, h,
                          GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, frameBuf
                      )
                      hasFrame = true
                  }

                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, 0)
                  GLES30.glViewport(0, 0, surfW, surfH)
                  GLES30.glClearColor(0f, 0f, 0f, 1f)
                  GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT)
                  if (!hasFrame || srcW == 0 || srcH == 0) return

                  val prog = if (progFinal != 0) progFinal else progPlain
                  if (prog == 0) return

                  val mode = upscale

                  // Filter tekstur sumber: nearest hanya untuk mode "Piksel".
                  val filt = if (mode == 3) GLES30.GL_NEAREST else GLES30.GL_LINEAR
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, texSrc)
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MIN_FILTER, filt)
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MAG_FILTER, filt)

                  var inTex = texSrc
                  if (mode == 1 && progEpx != 0 && fboOk) {
                      runEpx(texSrc, fbo[0], srcW * 2, srcH * 2)
                      runEpx(texUp[0], fbo[1], srcW * 4, srcH * 4)
                      inTex = texUp[1]
                  }

                  // Posisi game di layar: potret = rata atas, lanskap = tengah.
                  val aspect = srcW.toFloat() / srcH.toFloat()
                  var vw = surfW
                  var vh = surfH
                  var vx = 0
                  var vy = 0
                  if (surfH >= surfW) {
                      vw = surfW
                      vh = (surfW / aspect).toInt()
                      vy = surfH - vh
                  } else {
                      vh = surfH
                      vw = (surfH * aspect).toInt()
                      if (vw > surfW) {
                          vw = surfW
                          vh = (surfW / aspect).toInt()
                      }
                      vx = (surfW - vw) / 2
                      vy = (surfH - vh) / 2
                  }

                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, 0)
                  GLES30.glViewport(vx, vy, vw, vh)
                  GLES30.glUseProgram(prog)
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE0)
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, inTex)

                  val p = presets[light.coerceIn(0, presets.size - 1)]
                  GLES30.glUniform1i(loc(prog, "uSrc"), 0)
                  GLES30.glUniform1f(loc(prog, "uFlip"), 1f)
                  GLES30.glUniform2f(loc(prog, "uBaseSize"), srcW.toFloat(), srcH.toFloat())
                  GLES30.glUniform1f(loc(prog, "uSharp"), if (mode == 0) 1f else 0f)
                  GLES30.glUniform1f(loc(prog, "uColor"), p.color)
                  GLES30.glUniform1f(loc(prog, "uGrid"), p.grid)
                  GLES30.glUniform1f(loc(prog, "uGlow"), p.glow)
                  GLES30.glUniform1f(loc(prog, "uVignette"), p.vig)
                  GLES30.glUniform1f(loc(prog, "uBright"), p.bright)
                  GLES30.glUniform3f(loc(prog, "uTint"), p.tr, p.tg, p.tb)
                  GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, 3)
              }

              private fun runEpx(inTex: Int, outFbo: Int, w: Int, h: Int) {
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, outFbo)
                  GLES30.glViewport(0, 0, w, h)
                  GLES30.glUseProgram(progEpx)
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE0)
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, inTex)
                  GLES30.glUniform1i(loc(progEpx, "uTex"), 0)
                  GLES30.glUniform1f(loc(progEpx, "uFlip"), 0f)
                  GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, 3)
              }

              private fun ensureTextures(w: Int, h: Int) {
                  if (texSrc != 0 && w == srcW && h == srcH) return
                  srcW = w
                  srcH = h
                  if (texSrc == 0) {
                      val t = IntArray(3)
                      GLES30.glGenTextures(3, t, 0)
                      texSrc = t[0]
                      texUp[0] = t[1]
                      texUp[1] = t[2]
                      val f = IntArray(2)
                      GLES30.glGenFramebuffers(2, f, 0)
                      fbo[0] = f[0]
                      fbo[1] = f[1]
                  }
                  allocTex(texSrc, w, h)
                  allocTex(texUp[0], w * 2, h * 2)
                  allocTex(texUp[1], w * 4, h * 4)

                  fboOk = true
                  for (i in 0..1) {
                      GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, fbo[i])
                      GLES30.glFramebufferTexture2D(
                          GLES30.GL_FRAMEBUFFER, GLES30.GL_COLOR_ATTACHMENT0,
                          GLES30.GL_TEXTURE_2D, texUp[i], 0
                      )
                      if (GLES30.glCheckFramebufferStatus(GLES30.GL_FRAMEBUFFER) != GLES30.GL_FRAMEBUFFER_COMPLETE) {
                          fboOk = false
                      }
                  }
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, 0)
                  if (!fboOk) onError("FBO tidak lengkap, Scale4x dimatikan")
              }

              private fun allocTex(tex: Int, w: Int, h: Int) {
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex)
                  GLES30.glTexImage2D(
                      GLES30.GL_TEXTURE_2D, 0, GLES30.GL_RGBA8, w, h, 0,
                      GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, null
                  )
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MIN_FILTER, GLES30.GL_LINEAR)
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MAG_FILTER, GLES30.GL_LINEAR)
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_WRAP_S, GLES30.GL_CLAMP_TO_EDGE)
                  GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_WRAP_T, GLES30.GL_CLAMP_TO_EDGE)
              }

              private fun loc(prog: Int, name: String): Int = GLES30.glGetUniformLocation(prog, name)

              private fun asset(name: String): String =
                  ctx.assets.open("shaders/$name").bufferedReader().use { it.readText() }

              private fun compile(type: Int, src: String): Int {
                  val s = GLES30.glCreateShader(type)
                  GLES30.glShaderSource(s, src)
                  GLES30.glCompileShader(s)
                  val ok = IntArray(1)
                  GLES30.glGetShaderiv(s, GLES30.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) {
                      val log = GLES30.glGetShaderInfoLog(s)
                      GLES30.glDeleteShader(s)
                      throw RuntimeException(log)
                  }
                  return s
              }

              private fun buildProgram(fragAsset: String): Int {
                  try {
                      val vs = compile(GLES30.GL_VERTEX_SHADER, asset("vertex.vert"))
                      val fs = compile(GLES30.GL_FRAGMENT_SHADER, asset(fragAsset))
                      val p = GLES30.glCreateProgram()
                      GLES30.glAttachShader(p, vs)
                      GLES30.glAttachShader(p, fs)
                      GLES30.glLinkProgram(p)
                      val ok = IntArray(1)
                      GLES30.glGetProgramiv(p, GLES30.GL_LINK_STATUS, ok, 0)
                      GLES30.glDeleteShader(vs)
                      GLES30.glDeleteShader(fs)
                      if (ok[0] == 0) {
                          val log = GLES30.glGetProgramInfoLog(p)
                          GLES30.glDeleteProgram(p)
                          throw RuntimeException(log)
                      }
                      return p
                  } catch (e: Exception) {
                      onError("Shader " + fragAsset + " gagal: " + (e.message ?: "?").take(300))
                      return 0
                  }
              }
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/java/id/gba/shaderplayer/GamepadView.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/GamepadView.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View

          /** Kontrol layar sentuh: D-pad, A/B, L/R, Start/Select, dan tombol MENU. Bit tombol = id joypad libretro. */
          class GamepadView(ctx: Context) : View(ctx) {

              /** Dipanggil tiap kombinasi tombol sentuh berubah. */
              var onMask: (Int) -> Unit = {}

              /** Dipanggil saat tombol MENU disentuh. */
              var onMenu: () -> Unit = {}

              companion object {
                  const val BTN_B = 0
                  const val BTN_SELECT = 2
                  const val BTN_START = 3
                  const val BTN_UP = 4
                  const val BTN_DOWN = 5
                  const val BTN_LEFT = 6
                  const val BTN_RIGHT = 7
                  const val BTN_A = 8
                  const val BTN_L = 10
                  const val BTN_R = 11
              }

              private class Btn(val bit: Int, val label: String, val rect: RectF)

              private val btns = ArrayList<Btn>()
              private var menuRect = RectF()
              private var dpCx = 0f
              private var dpCy = 0f
              private var dpR = 0f
              private var mask = 0

              private val dens = resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()

              init {
                  line.style = Paint.Style.STROKE
                  line.strokeWidth = 2f * dens
                  line.color = Color.argb(140, 255, 255, 255)
                  fill.style = Paint.Style.FILL
                  txt.textAlign = Paint.Align.CENTER
                  txt.isFakeBoldText = true
                  txt.color = Color.argb(210, 255, 255, 255)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  btns.clear()
                  val fw = w.toFloat()
                  val fh = h.toFloat()
                  if (fh >= fw) layoutPortrait(fw, fh) else layoutLandscape(fw, fh)
              }

              private fun circle(bit: Int, label: String, cx: Float, cy: Float, r: Float) {
                  btns.add(Btn(bit, label, RectF(cx - r, cy - r, cx + r, cy + r)))
              }

              private fun pill(bit: Int, label: String, cx: Float, cy: Float, hw: Float, hh: Float) {
                  btns.add(Btn(bit, label, RectF(cx - hw, cy - hh, cx + hw, cy + hh)))
              }

              // Potret: game di bagian atas (rasio 3:2), kontrol di bawahnya.
              private fun layoutPortrait(w: Float, h: Float) {
                  val top = w * 2f / 3f
                  val ah = h - top
                  dpR = w * 0.20f
                  dpCx = w * 0.27f
                  dpCy = top + ah * 0.50f
                  circle(BTN_A, "A", w * 0.87f, top + ah * 0.40f, w * 0.085f)
                  circle(BTN_B, "B", w * 0.67f, top + ah * 0.52f, w * 0.085f)
                  pill(BTN_L, "L", w * 0.19f, top + w * 0.07f, w * 0.15f, w * 0.055f)
                  pill(BTN_R, "R", w * 0.81f, top + w * 0.07f, w * 0.15f, w * 0.055f)
                  pill(BTN_SELECT, "SELECT", w * 0.35f, h - w * 0.10f, w * 0.12f, w * 0.04f)
                  pill(BTN_START, "START", w * 0.65f, h - w * 0.10f, w * 0.12f, w * 0.04f)
                  menuRect = RectF(w * 0.43f, top + w * 0.02f, w * 0.57f, top + w * 0.12f)
              }

              // Lanskap: game di tengah, kontrol transparan di kiri/kanan.
              private fun layoutLandscape(w: Float, h: Float) {
                  val m = h * 0.06f
                  dpR = h * 0.24f
                  dpCx = m + dpR + w * 0.02f
                  dpCy = h * 0.62f
                  val r = h * 0.10f
                  circle(BTN_A, "A", w - m - r - w * 0.02f, h * 0.52f, r)
                  circle(BTN_B, "B", w - m - r - w * 0.02f - r * 2.4f, h * 0.68f, r)
                  pill(BTN_L, "L", m + h * 0.17f, m + h * 0.07f, h * 0.17f, h * 0.065f)
                  pill(BTN_R, "R", w - m - h * 0.17f, m + h * 0.07f, h * 0.17f, h * 0.065f)
                  pill(BTN_SELECT, "SELECT", w / 2f - h * 0.20f, h - m - h * 0.04f, h * 0.14f, h * 0.045f)
                  pill(BTN_START, "START", w / 2f + h * 0.20f, h - m - h * 0.04f, h * 0.14f, h * 0.045f)
                  menuRect = RectF(w / 2f - h * 0.09f, m, w / 2f + h * 0.09f, m + h * 0.12f)
              }

              override fun onDraw(canvas: Canvas) {
                  // D-pad
                  canvas.drawCircle(dpCx, dpCy, dpR, line)
                  val s = dpR * 0.22f
                  val off = dpR * 0.62f
                  arrow(canvas, dpCx, dpCy - off, 0f, -1f, s, (mask and (1 shl BTN_UP)) != 0)
                  arrow(canvas, dpCx, dpCy + off, 0f, 1f, s, (mask and (1 shl BTN_DOWN)) != 0)
                  arrow(canvas, dpCx - off, dpCy, -1f, 0f, s, (mask and (1 shl BTN_LEFT)) != 0)
                  arrow(canvas, dpCx + off, dpCy, 1f, 0f, s, (mask and (1 shl BTN_RIGHT)) != 0)

                  // Tombol A/B/L/R/Start/Select
                  for (b in btns) {
                      val on = (mask and (1 shl b.bit)) != 0
                      fill.color = Color.argb(if (on) 130 else 40, 255, 255, 255)
                      val rx = minOf(b.rect.width(), b.rect.height()) / 2f
                      canvas.drawRoundRect(b.rect, rx, rx, fill)
                      canvas.drawRoundRect(b.rect, rx, rx, line)
                      drawLabel(canvas, b.label, b.rect)
                  }

                  // Menu
                  fill.color = Color.argb(40, 255, 255, 255)
                  canvas.drawRoundRect(menuRect, 12f * dens, 12f * dens, fill)
                  canvas.drawRoundRect(menuRect, 12f * dens, 12f * dens, line)
                  drawLabel(canvas, "MENU", menuRect)
              }

              private fun arrow(c: Canvas, cx: Float, cy: Float, dx: Float, dy: Float, s: Float, on: Boolean) {
                  path.reset()
                  path.moveTo(cx + dx * s, cy + dy * s)
                  path.lineTo(cx - dx * s * 0.5f - dy * s * 0.8f, cy - dy * s * 0.5f + dx * s * 0.8f)
                  path.lineTo(cx - dx * s * 0.5f + dy * s * 0.8f, cy - dy * s * 0.5f - dx * s * 0.8f)
                  path.close()
                  fill.color = Color.argb(if (on) 200 else 80, 255, 255, 255)
                  c.drawPath(path, fill)
              }

              private fun drawLabel(c: Canvas, label: String, r: RectF) {
                  txt.textSize = minOf(r.width(), r.height()) * (if (label.length > 2) 0.30f else 0.5f)
                  val fm = txt.fontMetrics
                  c.drawText(label, r.centerX(), r.centerY() - (fm.ascent + fm.descent) / 2f, txt)
              }

              private fun maskAt(x: Float, y: Float): Int {
                  var m = 0
                  val dx = x - dpCx
                  val dy = y - dpCy
                  val d2 = dx * dx + dy * dy
                  if (d2 <= dpR * dpR * 1.2f && d2 >= dpR * dpR * 0.02f) {
                      val ang = Math.toDegrees(Math.atan2(dy.toDouble(), dx.toDouble()))
                      if (Math.abs(ang) < 67.5) m = m or (1 shl BTN_RIGHT)
                      if (Math.abs(ang) > 112.5) m = m or (1 shl BTN_LEFT)
                      if (ang > 22.5 && ang < 157.5) m = m or (1 shl BTN_DOWN)
                      if (ang < -22.5 && ang > -157.5) m = m or (1 shl BTN_UP)
                  }
                  for (b in btns) {
                      val pad = minOf(b.rect.width(), b.rect.height()) * 0.15f
                      if (x >= b.rect.left - pad && x <= b.rect.right + pad &&
                          y >= b.rect.top - pad && y <= b.rect.bottom + pad
                      ) {
                          m = m or (1 shl b.bit)
                      }
                  }
                  return m
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val act = e.actionMasked
                  var m = 0
                  if (act != MotionEvent.ACTION_UP && act != MotionEvent.ACTION_CANCEL) {
                      for (i in 0 until e.pointerCount) {
                          if (act == MotionEvent.ACTION_POINTER_UP && i == e.actionIndex) continue
                          m = m or maskAt(e.getX(i), e.getY(i))
                      }
                  }
                  if (act == MotionEvent.ACTION_DOWN || act == MotionEvent.ACTION_POINTER_DOWN) {
                      val i = e.actionIndex
                      if (menuRect.contains(e.getX(i), e.getY(i))) onMenu()
                  }
                  if (m != mask) {
                      mask = m
                      onMask(m)
                      invalidate()
                  }
                  return true
              }
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/java/id/gba/shaderplayer/EmuThread.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/EmuThread.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.opengl.GLSurfaceView
          import java.io.File

          /**
           * Thread emulator: memuat core + ROM, lalu menjalankan frame demi frame.
           * Kecepatan diatur oleh AudioTrack (tulis blocking), dengan pembatas waktu cadangan.
           */
          class EmuThread(
              private val ctx: Context,
              private val rom: ByteArray,
              private val romName: String,
              private val glView: GLSurfaceView,
              private val onError: (String) -> Unit
          ) : Thread("emu-thread") {

              @Volatile private var running = true
              @Volatile var paused = false
              @Volatile var fastForward = false

              fun quit() {
                  running = false
              }

              override fun run() {
                  var track: AudioTrack? = null
                  try {
                      val base = ctx.getExternalFilesDir(null) ?: ctx.filesDir
                      val sysDir = File(base, "system")
                      sysDir.mkdirs()
                      val saveDir = File(base, "saves")
                      saveDir.mkdirs()
                      val core = ctx.applicationInfo.nativeLibraryDir + "/libmgba_libretro_android.so"

                      val e1 = Native.loadCore(core, sysDir.absolutePath, saveDir.absolutePath)
                      if (e1 != null) {
                          onError(e1)
                          return
                      }
                      val e2 = Native.loadGame(rom, romName)
                      if (e2 != null) {
                          onError(e2)
                          return
                      }

                      val av = Native.avInfo()
                      val fps = if (av[0] > 1.0) av[0] else 59.7275
                      val frameNs = (1_000_000_000.0 / fps).toLong()

                      val sr = 48000
                      val minBuf = AudioTrack.getMinBufferSize(
                          sr, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT
                      )
                      val bufBytes = maxOf(minBuf, sr / 12 * 4)   // sekitar 80 ms
                      val t = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_GAME)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setSampleRate(sr)
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_STEREO)
                                  .build()
                          )
                          .setBufferSizeInBytes(bufBytes)
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                          .build()
                      track = t
                      t.play()

                      val audio = ShortArray(8192)
                      var last = System.nanoTime()
                      var n = 0
                      while (running) {
                          if (paused) {
                              t.pause()
                              while (paused && running) {
                                  Thread.sleep(30)
                              }
                              if (!running) break
                              t.flush()
                              t.play()
                              last = System.nanoTime()
                              continue
                          }

                          val ff = fastForward
                          var i = if (ff) 4 else 1
                          while (i > 0) {
                              Native.runFrame()
                              i--
                          }
                          val cnt = Native.drainAudio(audio)
                          if (!ff && cnt > 0) t.write(audio, 0, cnt)
                          glView.requestRender()

                          n++
                          if (n % 1800 == 0) Native.saveSram()   // sekitar tiap 30 detik

                          if (!ff) {
                              // Pembatas cadangan kalau audio tidak memblokir: maksimal sekitar 1,1x kecepatan asli.
                              val spare = frameNs * 9 / 10 - (System.nanoTime() - last)
                              if (spare > 0) Thread.sleep(spare / 1_000_000L, (spare % 1_000_000L).toInt())
                          }
                          last = System.nanoTime()
                      }
                  } catch (ex: Throwable) {
                      onError("Emulator berhenti: " + (ex.message ?: ex.javaClass.simpleName))
                  } finally {
                      try {
                          track?.stop()
                      } catch (ignored: Exception) {
                      }
                      track?.release()
                      Native.unload()   // menyimpan SRAM lalu membersihkan core
                  }
              }
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/java/id/gba/shaderplayer/MainActivity.kt
        run: |
          mkdir -p 'app/src/main/java/id/gba/shaderplayer'
          cat > 'app/src/main/java/id/gba/shaderplayer/MainActivity.kt' <<'GBA_FILE_EOF'
          package id.gba.shaderplayer

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.Color
          import android.net.Uri
          import android.opengl.GLSurfaceView
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.zip.ZipInputStream
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              companion object {
                  private const val REQ_OPEN = 1001
              }

              private lateinit var prefs: SharedPreferences
              private lateinit var glView: GLSurfaceView
              private lateinit var renderer: GameRenderer
              private lateinit var pad: GamepadView
              private lateinit var hint: TextView

              private var emu: EmuThread? = null
              private var upscaleIdx = 0
              private var lightIdx = 1
              private var touchMask = 0
              private var keyMask = 0
              private var axisMask = 0
              private var dialogs = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  prefs = getSharedPreferences("gba", MODE_PRIVATE)
                  upscaleIdx = prefs.getInt("upscale", 0).coerceIn(0, Opts.upscale.size - 1)
                  lightIdx = prefs.getInt("light", 1).coerceIn(0, Opts.light.size - 1)

                  renderer = GameRenderer(this) { msg -> toast(msg) }
                  renderer.upscale = upscaleIdx
                  renderer.light = lightIdx

                  glView = GLSurfaceView(this)
                  glView.setEGLContextClientVersion(3)
                  glView.setRenderer(renderer)
                  glView.renderMode = GLSurfaceView.RENDERMODE_WHEN_DIRTY

                  pad = GamepadView(this)
                  pad.onMask = { m ->
                      touchMask = m
                      pushMask()
                  }
                  pad.onMenu = { showMenu() }

                  hint = TextView(this)
                  hint.text = "Ketuk MENU lalu pilih \"Buka game…\"\n(file .gba atau .zip)"
                  hint.setTextColor(Color.WHITE)
                  hint.gravity = Gravity.CENTER
                  hint.textSize = 16f

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  root.addView(glView, FrameLayout.LayoutParams(mp, mp))
                  root.addView(hint, FrameLayout.LayoutParams(mp, mp))
                  root.addView(pad, FrameLayout.LayoutParams(mp, mp))
                  setContentView(root)
                  applyBars()

                  // Buka lagi game terakhir kalau masih bisa diakses.
                  val last = prefs.getString("lastRom", null)
                  if (last != null) startGame(Uri.parse(last))
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
                  if (dialogs == 0) emu?.paused = false
                  applyBars()
              }

              override fun onPause() {
                  emu?.paused = true
                  Native.saveSram()
                  glView.onPause()
                  super.onPause()
              }

              override fun onDestroy() {
                  stopEmu()
                  super.onDestroy()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applyBars()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) applyBars()
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  showMenu()
              }

              // Lanskap: layar penuh tanpa bar sistem. Potret: bar sistem normal.
              @Suppress("DEPRECATION")
              private fun applyBars() {
                  val landscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  if (Build.VERSION.SDK_INT >= 30) {
                      val c = window.insetsController ?: return
                      if (landscape) {
                          c.hide(WindowInsets.Type.systemBars())
                          c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      } else {
                          c.show(WindowInsets.Type.systemBars())
                      }
                  } else {
                      window.decorView.systemUiVisibility = if (landscape) {
                          View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      } else {
                          View.SYSTEM_UI_FLAG_VISIBLE
                      }
                  }
              }

              // ---------------------------------------------------------------- input fisik

              private fun pushMask() {
                  Native.setButtons(touchMask or keyMask or axisMask)
              }

              private fun keyBit(k: Int): Int = when (k) {
                  KeyEvent.KEYCODE_DPAD_UP -> GamepadView.BTN_UP
                  KeyEvent.KEYCODE_DPAD_DOWN -> GamepadView.BTN_DOWN
                  KeyEvent.KEYCODE_DPAD_LEFT -> GamepadView.BTN_LEFT
                  KeyEvent.KEYCODE_DPAD_RIGHT -> GamepadView.BTN_RIGHT
                  KeyEvent.KEYCODE_BUTTON_A, KeyEvent.KEYCODE_Z -> GamepadView.BTN_B
                  KeyEvent.KEYCODE_BUTTON_B, KeyEvent.KEYCODE_X -> GamepadView.BTN_A
                  KeyEvent.KEYCODE_BUTTON_L1, KeyEvent.KEYCODE_A -> GamepadView.BTN_L
                  KeyEvent.KEYCODE_BUTTON_R1, KeyEvent.KEYCODE_S -> GamepadView.BTN_R
                  KeyEvent.KEYCODE_BUTTON_START, KeyEvent.KEYCODE_ENTER -> GamepadView.BTN_START
                  KeyEvent.KEYCODE_BUTTON_SELECT, KeyEvent.KEYCODE_DEL, KeyEvent.KEYCODE_SHIFT_RIGHT -> GamepadView.BTN_SELECT
                  else -> -1
              }

              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  val bit = keyBit(e.keyCode)
                  if (bit >= 0) {
                      if (e.action == KeyEvent.ACTION_DOWN) {
                          keyMask = keyMask or (1 shl bit)
                      } else if (e.action == KeyEvent.ACTION_UP) {
                          keyMask = keyMask and (1 shl bit).inv()
                      }
                      pushMask()
                      return true
                  }
                  return super.dispatchKeyEvent(e)
              }

              override fun dispatchGenericMotionEvent(ev: MotionEvent): Boolean {
                  val fromStick = (ev.source and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                  if (fromStick && ev.action == MotionEvent.ACTION_MOVE) {
                      val hx = ev.getAxisValue(MotionEvent.AXIS_HAT_X)
                      val hy = ev.getAxisValue(MotionEvent.AXIS_HAT_Y)
                      val x = if (Math.abs(hx) > 0.5f) hx else ev.getAxisValue(MotionEvent.AXIS_X)
                      val y = if (Math.abs(hy) > 0.5f) hy else ev.getAxisValue(MotionEvent.AXIS_Y)
                      var m = 0
                      if (x < -0.5f) m = m or (1 shl GamepadView.BTN_LEFT)
                      if (x > 0.5f) m = m or (1 shl GamepadView.BTN_RIGHT)
                      if (y < -0.5f) m = m or (1 shl GamepadView.BTN_UP)
                      if (y > 0.5f) m = m or (1 shl GamepadView.BTN_DOWN)
                      axisMask = m
                      pushMask()
                      return true
                  }
                  return super.dispatchGenericMotionEvent(ev)
              }

              // ---------------------------------------------------------------- menu

              private fun showMenu() {
                  if (dialogs > 0) return
                  keyMask = 0
                  axisMask = 0
                  pushMask()
                  val e = emu
                  val ff = e != null && e.fastForward
                  val items = arrayOf(
                      "Buka game…",
                      "Upscale: " + Opts.upscale[upscaleIdx],
                      "Cahaya: " + Opts.light[lightIdx],
                      "Maju cepat: " + (if (ff) "Hidup" else "Mati"),
                      "Simpan state",
                      "Muat state",
                      "Reset game",
                      "Keluar"
                  )
                  dialogs++
                  emu?.paused = true
                  AlertDialog.Builder(this)
                      .setTitle("GBA Shader Player")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> openPicker()
                              1 -> choose("Upscale", Opts.upscale, upscaleIdx) { idx -> setUpscale(idx) }
                              2 -> choose("Cahaya", Opts.light, lightIdx) { idx -> setLight(idx) }
                              3 -> emu?.let { it.fastForward = !it.fastForward }
                              4 -> toast(if (Native.saveState()) "State tersimpan" else "Gagal menyimpan state")
                              5 -> toast(if (Native.loadState()) "State dimuat" else "State belum ada / gagal dimuat")
                              6 -> Native.reset()
                              7 -> finish()
                              else -> {}
                          }
                      }
                      .setOnDismissListener { closeDialog() }
                      .show()
              }

              private fun choose(title: String, names: Array<String>, cur: Int, onPick: (Int) -> Unit) {
                  dialogs++
                  emu?.paused = true
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setSingleChoiceItems(names, cur) { d, which ->
                          onPick(which)
                          d.dismiss()
                      }
                      .setOnDismissListener { closeDialog() }
                      .show()
              }

              private fun closeDialog() {
                  dialogs--
                  if (dialogs <= 0) {
                      dialogs = 0
                      emu?.paused = false
                  }
              }

              private fun setUpscale(idx: Int) {
                  upscaleIdx = idx
                  renderer.upscale = idx
                  prefs.edit().putInt("upscale", idx).apply()
                  glView.requestRender()
              }

              private fun setLight(idx: Int) {
                  lightIdx = idx
                  renderer.light = idx
                  prefs.edit().putInt("light", idx).apply()
                  glView.requestRender()
              }

              // ---------------------------------------------------------------- buka game

              private fun openPicker() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_OPEN)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OPEN && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (ignored: Exception) {
                      }
                      prefs.edit().putString("lastRom", uri.toString()).apply()
                      startGame(uri)
                  }
              }

              private fun startGame(uri: Uri) {
                  thread(name = "rom-loader") {
                      try {
                          val name = displayName(uri)
                          val stream = contentResolver.openInputStream(uri)
                              ?: throw RuntimeException("Tidak bisa membuka file")
                          var bytes = stream.use { it.readBytes() }
                          var romName = name
                          val isZip = bytes.size > 4 && bytes[0] == 'P'.code.toByte() && bytes[1] == 'K'.code.toByte()
                          if (isZip || name.endsWith(".zip", ignoreCase = true)) {
                              val z = unzipRom(bytes)
                                  ?: throw RuntimeException("ZIP tidak berisi file .gba/.gb/.gbc")
                              romName = z.first
                              bytes = z.second
                          }
                          val finalBytes = bytes
                          val finalName = romName
                          runOnUiThread { launchEmu(finalBytes, finalName) }
                      } catch (t: Throwable) {
                          toast("Gagal membuka game: " + (t.message ?: t.javaClass.simpleName))
                      }
                  }
              }

              private fun displayName(uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (ignored: Exception) {
                  }
                  return name ?: (uri.lastPathSegment ?: "game.gba")
              }

              private fun unzipRom(zip: ByteArray): Pair<String, ByteArray>? {
                  val z = ZipInputStream(zip.inputStream())
                  try {
                      var e = z.nextEntry
                      while (e != null) {
                          val n = e.name.lowercase()
                          if (!e.isDirectory && (n.endsWith(".gba") || n.endsWith(".gbc") || n.endsWith(".gb") || n.endsWith(".agb"))) {
                              return Pair(e.name.substringAfterLast('/'), z.readBytes())
                          }
                          e = z.nextEntry
                      }
                  } finally {
                      z.close()
                  }
                  return null
              }

              private fun launchEmu(rom: ByteArray, name: String) {
                  stopEmu()
                  hint.visibility = View.GONE
                  val t = EmuThread(this, rom, name, glView) { msg -> toast(msg) }
                  emu = t
                  t.start()
              }

              private fun stopEmu() {
                  val t = emu ?: return
                  t.quit()
                  try {
                      t.join(3000)
                  } catch (ignored: InterruptedException) {
                  }
                  emu = null
              }

              private fun toast(msg: String) {
                  runOnUiThread { Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
              }
          }
          GBA_FILE_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang SDK, NDK, CMake
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "pakai sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Unduh core mGBA (libretro, arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a core_tmp
          curl -fL --retry 3 --retry-delay 5 -o core_tmp/core.zip \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          unzip -o core_tmp/core.zip -d core_tmp
          SO=$(ls core_tmp/*.so | head -n 1)
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so
          ls -l app/src/main/jniLibs/arm64-v8a
          file app/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Ringkasan error (hanya jika gagal)
        if: failure()
        run: |
          echo "=== BARIS PENTING (screenshot bagian ini) ==="
          if [ -f build.log ]; then
            grep -nE "^e: |error:|FAILURE:|What went wrong|Could not |not found|Unresolved reference" -A2 build.log | head -70 || true
          else
            echo "(build.log belum ada: gagalnya sebelum langkah Build APK)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GBAShaderPlayer-APK
          path: app/build/outputs/apk/debug/*.apk
