      - name: Tulis app/src/main/assets/shaders/epx.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/epx.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Upscale 2x tepi-cerdas (Scale2x / EPX). Dipanggil 2 kali berurutan => Scale4x.
          // Piksel keluaran = piksel sumber, kecuali sudut yang jelas membentuk diagonal: diisi warna tetangga.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uTex;
          in vec2 vUV;
          out vec4 outColor;

          vec4 px(ivec2 p, ivec2 sz) {
              return texelFetch(uTex, clamp(p, ivec2(0), sz - ivec2(1)), 0);
          }

          void main() {
              ivec2 sz = textureSize(uTex, 0);
              ivec2 o = ivec2(gl_FragCoord.xy);   // koordinat piksel keluaran
              ivec2 s = o / 2;                    // piksel sumber
              ivec2 q = o - s * 2;                // sub-piksel (0/1), q.y = 0 berarti separuh atas gambar

              vec4 E = px(s, sz);
              vec4 B = px(s + ivec2(0, -1), sz);  // atas
              vec4 D = px(s + ivec2(-1, 0), sz);  // kiri
              vec4 F = px(s + ivec2(1, 0), sz);   // kanan
              vec4 H = px(s + ivec2(0, 1), sz);   // bawah

              vec4 r = E;
              if (q.y == 0) {
                  if (q.x == 0) { if (D == B && B != F && D != H) r = D; }
                  else          { if (B == F && B != D && F != H) r = F; }
              } else {
                  if (q.x == 0) { if (D == H && D != B && H != F) r = D; }
                  else          { if (H == F && D != H && B != F) r = F; }
              }
              outColor = r;
          }
          GBA_FILE_EOF

      - name: Tulis app/src/main/assets/shaders/final.frag
        run: |
          mkdir -p 'app/src/main/assets/shaders'
          cat > 'app/src/main/assets/shaders/final.frag' <<'GBA_FILE_EOF'
          #version 300 es
          // Pass akhir: sampling tajam/halus + warna layar GBA + grid LCD + glow (cahaya) + vignette.
          // Semua nilai diatur dari GameRenderer.kt (preset "Cahaya"); ubah di sini kalau mau rumus lain.
          precision highp float;
          precision highp int;
          uniform highp sampler2D uSrc;
          uniform vec2  uBaseSize;   // ukuran asli frame (mis. 240x160)
          uniform float uSharp;      // 1 = sharp bilinear anti-alias, 0 = sampling biasa
          uniform float uColor;      // 0..1  campuran koreksi warna LCD GBA
          uniform float uGrid;       // 0..1  kekuatan garis kisi antar piksel
          uniform float uGlow;       // 0..2  kekuatan glow dari area terang
          uniform float uVignette;   // 0..1  gelap di tepi layar
          uniform float uBright;     // pengali kecerahan untuk warna terkoreksi
          uniform vec3  uTint;       // nada warna (hangat = merah naik, biru turun)
          in vec2 vUV;
          out vec4 outColor;

          const vec2 K[8] = vec2[8](
              vec2(1.0, 0.0), vec2(-1.0, 0.0), vec2(0.0, 1.0), vec2(0.0, -1.0),
              vec2(0.707, 0.707), vec2(-0.707, 0.707), vec2(0.707, -0.707), vec2(-0.707, -0.707)
          );

          vec3 fetchColor(vec2 uv, vec2 fw) {
              if (uSharp > 0.5) {
                  vec2 p = uv * uBaseSize;
                  vec2 seam = floor(p + 0.5);
                  p = seam + clamp((p - seam) / fw, -0.5, 0.5);
                  return texture(uSrc, p / uBaseSize).rgb;
              }
              return texture(uSrc, uv).rgb;
          }

          vec3 brightPass(vec3 c) {
              return max(c - vec3(0.55), vec3(0.0));
          }

          // Meniru layar GBA: gamma LCD tinggi, warna saling bercampur sedikit.
          vec3 lcdColor(vec3 c) {
              vec3 lin = pow(c, vec3(3.2));
              vec3 m = vec3(dot(lin, vec3(0.86, 0.10, 0.04)),
                            dot(lin, vec3(0.12, 0.80, 0.08)),
                            dot(lin, vec3(0.00, 0.14, 0.86)));
              return pow(m, vec3(1.0 / 2.2));
          }

          void main() {
              vec2 p = vUV * uBaseSize;
              vec2 fw = max(fwidth(p), vec2(0.0001));
              vec3 c = fetchColor(vUV, fw);

              // Glow: ambil bagian terang di sekitar, rata-ratakan, tambahkan kembali.
              vec3 glow = vec3(0.0);
              if (uGlow > 0.0) {
                  for (int i = 0; i < 8; i++) {
                      vec2 d = K[i] / uBaseSize;
                      glow += brightPass(fetchColor(vUV + d * 1.5, fw));
                      glow += brightPass(fetchColor(vUV + d * 3.5, fw));
                  }
                  glow /= 16.0;
              }

              vec3 corrected = lcdColor(c) * uBright;
              vec3 col = mix(c, corrected, uColor);

              // Kisi LCD: gelap tipis di batas antar piksel sumber.
              vec2 f = fract(p);
              vec2 g = smoothstep(vec2(0.0), vec2(0.20), f) * (1.0 - smoothstep(vec2(0.80), vec2(1.0), f));
              col *= mix(1.0, g.x * g.y, uGrid);

              // Vignette lembut.
              vec2 q = vUV - 0.5;
              col *= 1.0 - uVignette * dot(q, q) * 1.8;

              col += glow * uGlow;
              col *= uTint;
              outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
          GBA_FILE_EOF

